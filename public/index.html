<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrevioBot</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ===================== LOGIN ===================== -->
  <div id="login-screen">
    <div class="login-bg"></div>
    <div class="login-card">
      <div class="login-logo">Crevio<span>Bot</span></div>
      <h1>Access Your Dashboard</h1>
      <p class="sub">Enter your API key to continue</p>
      <div class="input-icon-wrap">
        <i data-lucide="key-round" class="input-icon"></i>
        <input type="password" id="api-key-input" placeholder="Enter API Key" autocomplete="off">
      </div>
      <button class="btn-primary" id="login-btn">Login to Dashboard <i data-lucide="arrow-right" class="arrow"></i></button>
      <div class="login-error" id="login-error"></div>
      <div class="login-hint">Don't have a key? <a href="https://t.me/CrevioBot" target="_blank" rel="noopener">Register</a></div>
    </div>
  </div>

  <!-- ===================== APP ===================== -->
  <div id="app-screen" class="hidden">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="brand">Crev<span>io</span></div>

      <div class="nav-group-label">Account</div>
      <div class="nav-item" data-view="profile"><i data-lucide="user"></i> Profile</div>
      <div class="nav-item" data-view="discover"><i data-lucide="compass"></i> Discover Channels</div>
      <div class="nav-item" data-view="memberships"><i data-lucide="package"></i> Memberships</div>
      <div class="nav-item" data-view="transactions"><i data-lucide="credit-card"></i> Transactions</div>

      <div id="nav-creator" class="hidden">
        <div class="nav-group-label">Creator</div>
        <div class="nav-item" data-view="creator-dashboard"><i data-lucide="layout-dashboard"></i> Dashboard</div>
        <div class="nav-item" data-view="creator-channels"><i data-lucide="tv"></i> Channels</div>
        <div class="nav-item" data-view="creator-plans"><i data-lucide="layers"></i> Plans</div>
        <div class="nav-item" data-view="creator-members"><i data-lucide="users"></i> Members</div>
        <div class="nav-item" data-view="creator-payments"><i data-lucide="wallet"></i> Payments</div>
        <div class="nav-item" data-view="creator-settings"><i data-lucide="settings"></i> Settings</div>
      </div>

      <div id="nav-admin" class="hidden">
        <div class="nav-group-label">Admin</div>
        <div class="nav-item" data-view="admin-overview"><i data-lucide="shield"></i> Overview</div>
        <div class="nav-item" data-view="admin-users"><i data-lucide="users-round"></i> Users</div>
        <div class="nav-item" data-view="admin-creators"><i data-lucide="mic"></i> Creators</div>
        <div class="nav-item" data-view="admin-channels"><i data-lucide="tv"></i> Channels</div>
        <div class="nav-item" data-view="admin-transactions"><i data-lucide="credit-card"></i> Transactions</div>
      </div>

      <div class="sidebar-footer">
        <button class="logout-btn" id="logout-btn"><i data-lucide="log-out"></i> Logout</button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:12px;">
          <button class="menu-toggle" id="menu-toggle"><i data-lucide="menu"></i></button>
          <h2 id="view-title">Profile</h2>
        </div>
        <div class="who" id="who-label"></div>
      </div>
      <div id="content"></div>
    </main>
  </div>

  <div id="modal-root"></div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
