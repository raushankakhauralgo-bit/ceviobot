<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crevio</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ===================== LOGIN ===================== -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-logo">Crevio<span>Bot</span></div>
      <h1>Access Your Dashboard</h1>
      <p class="sub">Enter your API key to continue</p>
      <div class="input-icon-wrap">
        <span class="input-icon">🔑</span>
        <input type="password" id="api-key-input" placeholder="Enter API Key" autocomplete="off">
      </div>
      <button class="btn-primary" id="login-btn">Login to Dashboard <span class="arrow">→</span></button>
      <div class="login-error" id="login-error"></div>
      <div class="login-hint">Don't have a key? <a href="https://t.me/CrevioBot" target="_blank" rel="noopener">Register</a></div>
    </div>
  </div>

  <!-- ===================== APP ===================== -->
  <div id="app-screen" class="hidden">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="brand">Crev<span>io</span></div>

      <div class="nav-group-label">Account</div>
      <div class="nav-item" data-view="profile">👤 Profile</div>
      <div class="nav-item" data-view="memberships">📦 Memberships</div>
      <div class="nav-item" data-view="transactions">💳 Transactions</div>

      <div id="nav-creator" class="hidden">
        <div class="nav-group-label">Creator</div>
        <div class="nav-item" data-view="creator-dashboard">📊 Dashboard</div>
        <div class="nav-item" data-view="creator-channels">📺 Channels</div>
        <div class="nav-item" data-view="creator-plans">🗂️ Plans</div>
        <div class="nav-item" data-view="creator-members">🧑‍🤝‍🧑 Members</div>
        <div class="nav-item" data-view="creator-payments">💰 Payments</div>
        <div class="nav-item" data-view="creator-settings">⚙️ Settings</div>
      </div>

      <div id="nav-admin" class="hidden">
        <div class="nav-group-label">Admin</div>
        <div class="nav-item" data-view="admin-overview">🛠️ Overview</div>
        <div class="nav-item" data-view="admin-users">👥 Users</div>
        <div class="nav-item" data-view="admin-creators">🎙️ Creators</div>
        <div class="nav-item" data-view="admin-channels">📺 Channels</div>
        <div class="nav-item" data-view="admin-transactions">💳 Transactions</div>
      </div>

      <div class="sidebar-footer">
        <button class="logout-btn" id="logout-btn">Logout</button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:12px;">
          <button class="menu-toggle" id="menu-toggle">☰</button>
          <h2 id="view-title">Profile</h2>
        </div>
        <div class="who" id="who-label"></div>
      </div>
      <div id="content"></div>
    </main>
  </div>

  <div id="modal-root"></div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
